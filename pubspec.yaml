name: iron_log
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  dio: ^5.8.0+1
  go_router: ^16.0.0
  firebase_auth: ^6.5.2
  google_sign_in: ^7.1.1
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  flutter_svg: ^1.1.1
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0 

  # Offline-first database
  drift: ^2.14.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.3
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.3.0

  # On-device speech recognition (Android pt-BR)
  # 7.5.0-beta.1: Kotlin 2.2 / built-in KGP (7.4.0 breaks compile with conflicting pluginChannelName)
  speech_to_text: 7.5.0-beta.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  drift_dev: ^2.14.0
  flutter_native_splash: ^2.4.3
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  patrol: ^4.4.0
  integration_test:
    sdk: flutter

  test_api: any
patrol:
  app_name: Iron Log
  test_directory: integration_test
  android:
    package_name: com.example.iron_log
  ios:
    bundle_id: com.example.ironLog

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/barlow/
    - assets/fire-sequence.svg
    - assets/images/
    - assets/images/app_logo.svg
    - assets/type-muscles/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/barlow/Barlow-Regular.ttf
        - asset: assets/fonts/barlow/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/barlow/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/barlow/Barlow-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/barlow/Barlow-Black.ttf
          weight: 900
        - asset: assets/fonts/barlow/Barlow-Thin.ttf
          weight: 100
        - asset: assets/fonts/barlow/Barlow-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/barlow/Barlow-Light.ttf
          weight: 300
        - asset: assets/fonts/barlow/Barlow-Italic.ttf
          style: italic
        - asset: assets/fonts/barlow/Barlow-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/barlow/Barlow-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/barlow/Barlow-BoldItalic.ttf
          weight: 700
          style: italic

flutter_native_splash:
  color: "#FFFFFF"
  # Canvas quadrado + logo centralizada (proporção preservada) para evitar estico no nativo
  image: assets/images/app_logo_splash.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: contain
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: assets/images/app_logo_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/app_logo.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  remove_alpha_ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_logo.png
